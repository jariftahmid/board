<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="customPopup" class="popup-overlay">
    <div class="popup-content">
        <span id="closeBtn" class="close-icon">&times;</span>
        <h2>Welcome to our site!</h2>
        <p>This is a one-time popup per session.</p>
    </div>
</div>

<style>
    /* Popup background overlay */
    .popup-overlay {
        display: none; /* Default e hidden thakbe */
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }

    /* Popup box */
    .popup-content {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        text-align: center;
        position: relative;
        min-width: 300px;
    }

    /* Cross icon style */
    .close-icon {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 25px;
        cursor: pointer;
        color: #333;
    }
</style>
<script>
    window.onload = function() {
        // Check korchi agei eita dekhano hoyeche kina
        if (!sessionStorage.getItem('popupShown')) {
            
            // 3 second (3000ms) por popup dekhabe
            setTimeout(function() {
                document.getElementById('customPopup').style.display = 'flex';
            }, 3000);

            // Cross button e click korle ki hobe
            document.getElementById('closeBtn').addEventListener('click', function() {
                // Popup bondho korbe
                document.getElementById('customPopup').style.display = 'none';
                
                // Session e save korbe jate ar na ashe
                sessionStorage.setItem('popupShown', 'true');

                // Notun link open korbe
                window.open('https://yourlink.com', '_blank'); 
            });
        }
    };
</script>
</body>
</html>
