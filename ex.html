<style>
    /* Popup background overlay */
    .popup-overlay {
        display: none; /* Default e hidden thakbe */
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }

    /* Popup box */
    .popup-content {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        text-align: center;
        position: relative;
        min-width: 300px;
    }

    /* Cross icon style */
    .close-icon {

        top: 10px;
