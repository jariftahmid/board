<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Display | Professor Jarif</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .display-main { max-width: 900px; margin: 40px auto; padding: 20px; font-family: 'Outfit', sans-serif; }
        .question-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .img-box { margin-bottom: 30px; text-align: center; }
        .img-box img { max-width: 100%; border-radius: 8px; border: 1px solid #eee; margin-top: 10px; }
        .not-available { color: #d9534f; background: #f9f2f2; padding: 15px; border-radius: 6px; display: inline-block; font-weight: 500; }
        h1 { text-transform: uppercase; color: #2d3436; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h3 { color: #0984e3; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="display-main">
        <div class="question-card">
            <h1 id="header-title">Loading...</h1>
            
            <div class="section">
                <h3>MCQ Questions</h3>
                <div id="mcq-wrap" class="img-box"></div>
            </div>

            <div class="section">
                <h3>CQ Questions</h3>
                <div id="cq-wrap" class="img-box"></div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const exam = params.get('exam');
        const subject = params.get('subject');
        const board = params.get('board');
        const year = params.get('year');

        // আপনার অন্য রিপোজিটরি লিঙ্ক এখানে দিন
        const repoBase = "https://raw.githubusercontent.com/YOUR_GITHUB_USER/YOUR_REPO_NAME/main";
        const slug = `${exam}/${subject}/${board}/${year}`;

        if(exam) {
            document.getElementById('header-title').innerText = `${exam} ${year} - ${subject} (${board})`;
        }

        function addImage(containerId, fileName, errorLabel, isOptional = false) {
            const container = document.getElementById(containerId);
            const img = new Image();
            img.src = `${repoBase}/${slug}/${fileName}`;
            
            img.onload = () => container.appendChild(img);
            img.onerror = () => {
                if(!isOptional) {
                    const msg = document.createElement('div');
                    msg.className = "not-available";
                    msg.innerText = errorLabel;
                    container.appendChild(msg);
                }
            };
        }

        // ইমেজ লোড করা (১ ও ৩ বাধ্যতামূলক, ২ ও ৪ ঐচ্ছিক)
        if(exam && subject && board && year) {
            addImage('mcq-wrap', '1.jpg', 'MCQ not available');
            addImage('mcq-wrap', '2.jpg', '', true);
            
            addImage('cq-wrap', '3.jpg', 'CQ not available');
            addImage('cq-wrap', '4.jpg', '', true);
        }
    </script>
</body>
</html>
