<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Viewer | BoardQues</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #f9f9f9;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .error-box {
            padding: 40px 20px;
        }
        .error-box h2 {
            text-transform: uppercase;
            font-size: 26px;
            margin-bottom: 8px;
        }
        .error-box p {
            font-size: 18px;
            color: #666;
        }
        .q-img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #eee;
        }
        h1.title {
            font-size: 22px;
            margin-bottom: 30px;
            border-bottom: 2px solid #0984e3;
            display: inline-block;
            padding-bottom: 5px;
        }
        h3 {
            text-align: left;
            color: #0984e3;
            margin-top: 30px;
        }
        .loading {
            font-size: 18px;
            color: #888;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div class="loading">Searching for question...</div>
</div>

<script>
    // 1️⃣ URL params
    const params = new URLSearchParams(window.location.search);
    const exam = params.get("exam");      // ssc
    const subject = params.get("subject"); // bangla / physics
    const year = params.get("year");      // 2025

    // 2️⃣ GitHub config (FINAL)
    const username = "jarif";
    const repo = `bq${year}`;
    const baseURL = `https://raw.githubusercontent.com/${username}/${repo}/main/${exam}`;

    const container = document.getElementById("main-container");

    // 3️⃣ Error UI
    function showNotAvailable() {
        container.innerHTML = `
            <div class="error-box">
                <h2>${exam.toUpperCase()} ${year} ${subject.toUpperCase()}</h2>
                <p>Sorry, question not available</p>
                <br>
                <a href="question.html" style="color:#0984e3;font-weight:600;">← Go Back</a>
            </div>
        `;
    }

    // 4️⃣ Load images
    async function loadQuestions() {
        try {
            const testImage = `${baseURL}/${subject}1.jpg`;
            const res = await fetch(testImage);

            if (!res.ok) return showNotAvailable();

            container.innerHTML = `
                <h1 class="title">${exam.toUpperCase()} ${year} - ${subject.toUpperCase()}</h1>

                <h3>Questions</h3>
                <img src="${baseURL}/${subject}1.jpg" class="q-img" onerror="this.style.display='none'">
                <img src="${baseURL}/${subject}2.jpg" class="q-img" onerror="this.style.display='none'">
                <img src="${baseURL}/${subject}3.jpg" class="q-img" onerror="this.style.display='none'">
                <img src="${baseURL}/${subject}4.jpg" class="q-img" onerror="this.style.display='none'">
            `;
        } catch {
            showNotAvailable();
        }
    }

    // 5️⃣ Init
    if (exam && subject && year) {
        loadQuestions();
    } else {
        container.innerHTML = "<h2>Invalid Request</h2>";
    }
</script>

</body>
</html>
