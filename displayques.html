<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Display | Professor Jarif</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .display-main { max-width: 900px; margin: 40px auto; padding: 20px; font-family: 'Outfit', sans-serif; }
        .question-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .img-box { margin-bottom: 30px; text-align: center; }
        .img-box img { max-width: 100%; border-radius: 8px; border: 1px solid #eee; margin-top: 10px; }
        .not-available { color: #d9534f; background: #f9f2f2; padding: 15px; border-radius: 6px; display: inline-block; font-weight: 500; }
        h1 { text-transform: uppercase; color: #2d3436; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h3 { color: #0984e3; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="display-main">
        <div class="question-card">
            <h1 id="header-title">Loading...</h1>
            
            <div class="section">
                <h3>MCQ Questions</h3>
                <div id="mcq-wrap" class="img-box"></div>
            </div>

            <div class="section">
                <h3>CQ Questions</h3>
                <div id="cq-wrap" class="img-box"></div>
            </div>
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const exam = params.get('exam') || "";
    const subject = params.get('subject') || "";
    const board = params.get('board') || "";
    const year = params.get('year') || "";

    // GitHub Repo Info
    const username = "YOUR_GITHUB_USERNAME"; 
    const repo = "YOUR_REPO_NAME";           
    const repoBase = `https://raw.githubusercontent.com/${username}/${repo}/main`;
    const slug = `${exam.toLowerCase()}/${subject.toLowerCase()}/${board.toLowerCase()}/${year}`;

    const headerTitle = document.getElementById('header-title');
    const mcqArea = document.getElementById('mcq-area');
    const cqArea = document.getElementById('cq-area');

    if(exam) {
        headerTitle.innerText = `${exam.toUpperCase()} ${year} - ${subject.toUpperCase()} (${board.toUpperCase()} BOARD)`;
    }

    // Custom Error Message Function
    function showErrorMessage() {
        const errorContent = `
            <div style="text-align: center; margin-top: 50px;">
                <h2 style="text-transform: uppercase;">${exam} ${year} ${subject}</h2>
                <p style="font-size: 1.2rem; color: #555;">Sorry, question not available</p>
            </div>
        `;
        document.querySelector('.container').innerHTML = errorContent;
    }

    function fetchImage(containerId, fileName, isMain = false) {
        const container = document.getElementById(containerId);
        const img = new Image();
        img.src = `${repoBase}/${slug}/${fileName}`;

        img.onload = function() {
            container.appendChild(img);
        };

        img.onerror = function() {
            if (isMain) {
                // Jodi 1.jpg na pay, tahole custom error message dekhabe
                showErrorMessage();
            } else {
                img.style.display = 'none'; // Optional image na thakle hide thakbe
            }
        };
    }

    // Logic: 1.jpg ke main dhora hoyeche
    if (exam && subject && board && year) {
        fetchImage('mcq-area', '1.jpg', true);  // MCQ 1 (Main)
        fetchImage('mcq-area', '2.jpg', false); // MCQ 2
        fetchImage('cq-area', '3.jpg', false);  // CQ 1
        fetchImage('cq-area', '4.jpg', false);  // CQ 2
    } else {
        headerTitle.innerText = "Invalid Search!";
    }
</script>
</body>
</html>
